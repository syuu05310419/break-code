<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BREAK CODE カード編集</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#eef2ff;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}header{position:sticky;top:0;z-index:10;background:#111c31ed;backdrop-filter:blur(10px);padding:14px 15px;border-bottom:1px solid #33445e}h1{font-size:19px;margin:0 0 7px}.hint{font-size:12px;color:#b9c5dc}.toolbar{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}button,.import{border:1px solid #566789;background:#243755;color:white;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}button.primary{background:#2764d8;border-color:#4c89ff}button:active{opacity:.7}input,textarea,select{font:inherit;color:#fff;background:#19283f;border:1px solid #4a5a73;border-radius:9px;padding:10px;min-width:0;width:100%}textarea{resize:vertical;min-height:70px}#search{margin-top:10px}main{padding:12px;max-width:820px;margin:auto}.card{border:1px solid #34445e;background:#151f32;border-radius:14px;padding:13px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 12px}.id{font-size:12px;color:#aab8d0;margin-right:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:#b8c6df;margin-bottom:4px}.wide{grid-column:1/-1}.save{font-size:12px;color:#83e0a6}#status{padding-left:3px}#count{color:#b4c5e7;font-size:12px;margin:0 0 10px}footer{text-align:center;color:#9dabc2;padding:20px;font-size:12px}#filter{width:auto;flex:1}#file{display:none}@media(max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>🃏 BREAK CODE 全カード編集</h1><div class="hint">スマホで直接編集 → 自動保存 → CSVを書き出してチャットに送ってね</div><input id="search" placeholder="🔎 カード名・効果で検索"><div class="toolbar"><select id="filter" aria-label="レアリティ絞り込み"><option value="">すべて表示</option><option value="N">Normal</option><option value="R">Rare</option><option value="L">Legend</option><option value="S">Secret</option></select><button class="primary" id="export">⬇ CSV保存</button><button id="importBtn">CSV読込</button><input type="file" id="file" accept=".csv,text/csv"><button id="reset">初期化</button></div><div id="status" class="save">編集内容はこのブラウザ内に自動保存されます</div></header><main><div id="count"></div><div id="cards"></div></main><footer>カードIDは固定。CSVを送ってもらえればゲーム反映用に確認できます。</footer><script>
const original=[{"id": "1", "name": "Luminary創設！　とま", "rarity": "N", "type": "U", "cost": "1", "atk": "1", "hp": "2", "tags": "男,鯖主", "keywords": "", "effect": "", "memo": ""}, {"id": "2", "name": "Luminary創設！　RIKKUN", "rarity": "N", "type": "U", "cost": "1", "atk": "2", "hp": "1", "tags": "男,鯖主", "keywords": "", "effect": "", "memo": ""}, {"id": "3", "name": "フリルが寝床　水瀬", "rarity": "N", "type": "U", "cost": "1", "atk": "1", "hp": "1", "tags": "男,寝落ち", "keywords": "", "effect": "", "memo": ""}, {"id": "4", "name": "ディーラー　るみ姉", "rarity": "N", "type": "U", "cost": "2", "atk": "2", "hp": "1", "tags": "女,bot", "keywords": "", "effect": "", "memo": ""}, {"id": "5", "name": "みんなの妹　えみ", "rarity": "N", "type": "U", "cost": "1", "atk": "1", "hp": "1", "tags": "女,bot", "keywords": "", "effect": "", "memo": ""}, {"id": "6", "name": "会議の番人　nekopen", "rarity": "N", "type": "U", "cost": "2", "atk": "2", "hp": "1", "tags": "男", "keywords": "", "effect": "召喚時（任意）：手札1枚を捨ててもよい。捨てた場合、1枚引く", "memo": ""}, {"id": "7", "name": "Luminaryのオタク　うさ", "rarity": "N", "type": "U", "cost": "2", "atk": "2", "hp": "1", "tags": "女", "keywords": "", "effect": "召喚時：相手の手札1枚をランダムに捨てる", "memo": ""}, {"id": "8", "name": "裏サメbot", "rarity": "N", "type": "U", "cost": "2", "atk": "0", "hp": "2", "tags": "サメ,bot", "keywords": "速攻", "effect": "召喚時：自分の場のサメの数だけ攻撃力増加", "memo": ""}, {"id": "9", "name": "おーまいがっちょん！　mado", "rarity": "N", "type": "U", "cost": "3", "atk": "2", "hp": "3", "tags": "女", "keywords": "", "effect": "召喚時：自分のリーダーHPを2回復", "memo": ""}, {"id": "10", "name": "優しい瞳　くろぱん", "rarity": "N", "type": "U", "cost": "3", "atk": "3", "hp": "3", "tags": "男,ゲーマー", "keywords": "ガード", "effect": "", "memo": ""}, {"id": "11", "name": "Luminaryスロット", "rarity": "N", "type": "S", "cost": "2", "atk": "0", "hp": "0", "tags": "ゲーム,bot", "keywords": "", "effect": "1枚引く。追加1コストでさらに1枚", "memo": ""}, {"id": "12", "name": "面接", "rarity": "N", "type": "S", "cost": "2", "atk": "0", "hp": "0", "tags": "鯖主", "keywords": "", "effect": "デッキから鯖主ユニットをランダムに手札へ", "memo": ""}, {"id": "13", "name": "プロフ審査", "rarity": "N", "type": "S", "cost": "1", "atk": "0", "hp": "0", "tags": "bot", "keywords": "", "effect": "山札の一番上を公開。ユニットなら手札へ、スペルなら捨て札へ", "memo": ""}, {"id": "14", "name": "きゅんタグ", "rarity": "N", "type": "S", "cost": "1", "atk": "0", "hp": "0", "tags": "サーバータグ", "keywords": "", "effect": "相手ユニットかリーダーに2ダメージ", "memo": ""}, {"id": "15", "name": "うさぎさんレース", "rarity": "N", "type": "S", "cost": "4", "atk": "0", "hp": "0", "tags": "ゲーム,bot", "keywords": "", "effect": "味方1体に速攻を付与", "memo": ""}, {"id": "16", "name": "みあちゃんねる！　みあ", "rarity": "R", "type": "U", "cost": "2", "atk": "2", "hp": "2", "tags": "女,アイドル", "keywords": "", "effect": "召喚時（任意）：手札1枚を捨ててもよい。捨てた場合、最大コスト+1", "memo": ""}, {"id": "17", "name": "ゲームマスター　纏", "rarity": "R", "type": "U", "cost": "4", "atk": "2", "hp": "4", "tags": "男,bot", "keywords": "再生", "effect": "botスペル使用時：相手リーダーに1ダメージ", "memo": ""}, {"id": "18", "name": "サメbot", "rarity": "R", "type": "U", "cost": "2", "atk": "2", "hp": "2", "tags": "サメ,bot", "keywords": "", "effect": "召喚時：1枚引く", "memo": ""}, {"id": "19", "name": "るみのパティシエール　や～", "rarity": "R", "type": "U", "cost": "5", "atk": "3", "hp": "4", "tags": "男,ゲーマー", "keywords": "", "effect": "召喚時：味方1体を+2/+2、自リーダー2回復", "memo": ""}, {"id": "20", "name": "創作仕事人　冬李", "rarity": "R", "type": "U", "cost": "3", "atk": "3", "hp": "2", "tags": "女,クリエイター", "keywords": "", "effect": "召喚時：敵リーダー3、自リーダー1ダメージ", "memo": ""}, {"id": "21", "name": "通りすがりの凶器　kqrqsu", "rarity": "R", "type": "U", "cost": "4", "atk": "4", "hp": "2", "tags": "男,悪魔", "keywords": "貫通,速攻", "effect": "女への攻撃時：攻撃力+2", "memo": ""}, {"id": "22", "name": "Luminaryの聖母　みどり", "rarity": "R", "type": "U", "cost": "5", "atk": "4", "hp": "6", "tags": "女,ママ", "keywords": "ガード,再生", "effect": "召喚時：他の味方全員+1/+1、女はさらに+1/+1", "memo": ""}, {"id": "23", "name": "童貞喰い　ねこ", "rarity": "R", "type": "U", "cost": "7", "atk": "4", "hp": "3", "tags": "女", "keywords": "速攻,再生", "effect": "味方4体破壊で手札から0召喚可。召喚時：手札のコスト5以下の女を0召喚、敵リーダー3ダメージ", "memo": ""}, {"id": "24", "name": "サメbot創設者　ひも", "rarity": "R", "type": "U", "cost": "7", "atk": "3", "hp": "7", "tags": "男,サメ,クリエイター", "keywords": "ガード", "effect": "場にいる間サメは貫通。召喚時：捨て札からサメを最大3体ランダム召喚", "memo": ""}, {"id": "25", "name": "男・尊・女・卑！！！！", "rarity": "R", "type": "S", "cost": "6", "atk": "0", "hp": "0", "tags": "男,必殺技", "keywords": "", "effect": "自分の場に男2体以上・女0体：敵ユニット全破壊、敵リーダー6ダメージ", "memo": ""}, {"id": "26", "name": "女・尊・男・卑！！！！", "rarity": "R", "type": "S", "cost": "6", "atk": "0", "hp": "0", "tags": "女", "keywords": "", "effect": "自分の場に女2体以上・男0体：敵手札全捨て、敵リーダー7ダメージ", "memo": ""}, {"id": "27", "name": "Luminary総会", "rarity": "R", "type": "S", "cost": "5", "atk": "0", "hp": "0", "tags": "鯖主", "keywords": "", "effect": "敵ユニット1体破壊、敵リーダー2ダメージ、2枚引く", "memo": ""}, {"id": "28", "name": "Luminaryの創造主　りくとま", "rarity": "L", "type": "U", "cost": "8", "atk": "8", "hp": "6", "tags": "男,鯖主,神", "keywords": "貫通,再生", "effect": "召喚時：1枚引きコスト0化、敵リーダー6ダメージ", "memo": ""}, {"id": "29", "name": "人類もきゅ化計画　ちゆ&もきゅ獣たち", "rarity": "L", "type": "U", "cost": "8", "atk": "5", "hp": "8", "tags": "女,酒カス,もきゅ", "keywords": "", "effect": "相手ターン中、自分のリーダーとユニットが受けるダメージをそれぞれ-1。召喚時：敵ユニット全体に4ダメージ", "memo": ""}, {"id": "30", "name": "耀光龍 ルミナリア", "rarity": "L", "type": "U", "cost": "8", "atk": "6", "hp": "6", "tags": "ドラゴン", "keywords": "貫通", "effect": "破壊時：次のターン開始時、捨て札から0コスト召喚し速攻を得る", "memo": ""}];
const key='breakcode-mobile-card-editor-v1';
let cards;
try{const stored=JSON.parse(localStorage.getItem(key));cards=Array.isArray(stored)&&stored.length===original.length?stored:structuredClone(original)}catch(e){cards=JSON.parse(JSON.stringify(original))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=[['name','カード名'],['rarity','レアリティ'],['type','種類'],['cost','コスト'],['atk','ATK'],['hp','HP'],['tags','タグ'],['keywords','能力キーワード'],['effect','効果テキスト'],['memo','修正メモ']];
const selectOptions={rarity:[['N','Normal'],['R','Rare'],['L','Legend'],['S','Secret']],type:[['U','ユニット'],['S','スペル']]};
function field(k,label,c){let el=selectOptions[k]?`<select data-k="${k}">${selectOptions[k].map(([v,t])=>`<option value="${v}" ${c[k]===v?'selected':''}>${t}</option>`).join('')}</select>`:k==='effect'||k==='memo'?`<textarea data-k="${k}" rows="${k==='effect'?3:2}">${esc(c[k])}</textarea>`:`<input data-k="${k}" ${['cost','atk','hp'].includes(k)?'type="number" inputmode="numeric"':'type="text"'} value="${esc(c[k])}">`;return `<div class="field ${['name','tags','keywords','effect','memo'].includes(k)?'wide':''}"><label>${label}</label>${el}</div>`}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),r=document.querySelector('#filter').value;const visible=cards.filter(c=>(!r||c.rarity===r)&&(!q||[c.name,c.effect,c.tags,c.keywords,c.memo].join(' ').toLowerCase().includes(q)));document.querySelector('#count').textContent=`${visible.length} / ${cards.length} 枚を表示`;document.querySelector('#cards').innerHTML=visible.map(c=>`<section class="card" data-id="${esc(c.id)}"><h2><span class="id">#${esc(c.id)}</span>${esc(c.name)}</h2><div class="grid">${fields.map(([k,l])=>field(k,l,c)).join('')}</div></section>`).join('')||'<p>該当するカードがありません</p>'}
function save(){try{localStorage.setItem(key,JSON.stringify(cards));document.querySelector('#status').textContent='✓ 自動保存しました'}catch(e){document.querySelector('#status').textContent='⚠ 自動保存できません。CSV保存してください'}}
document.querySelector('#cards').addEventListener('input',update);document.querySelector('#cards').addEventListener('change',update);
function update(e){const el=e.target;if(!el.dataset.k)return;const section=el.closest('[data-id]');const c=cards.find(x=>x.id===section.dataset.id);if(!c)return;c[el.dataset.k]=el.value;if(el.dataset.k==='name')section.querySelector('h2').lastChild.textContent=el.value;save()}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#filter').addEventListener('change',render);
const headers=['ID（変更しない）','カード名','レアリティ N/R/L','種類 U=ユニット S=スペル','コスト','ATK','HP','タグ（カンマ区切り）','能力キーワード（カンマ区切り）','効果テキスト','修正メモ（任意）'];const keys=['id',...fields.map(f=>f[0])];
function csvCell(x){let s=String(x??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
document.querySelector('#export').onclick=()=>{const csv='\ufeff'+[headers,...cards.map(c=>keys.map(k=>c[k]))].map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='BREAK_CODE_カード修正済み.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};
document.querySelector('#importBtn').onclick=()=>document.querySelector('#file').click();
function parseCSV(text){text=text.replace(/^\ufeff/,'');let rows=[],row=[],val='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){val+='"';i++}else if(ch==='"')quoted=false;else val+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(val);val=''}else if(ch==='\n'){row.push(val.replace(/\r$/,''));rows.push(row);row=[];val=''}else val+=ch}if(row.length||val){row.push(val);rows.push(row)}return rows}
document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=parseCSV(await f.text());const next=rows.slice(1).filter(r=>r.length>=11).map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]??''])));if(next.length!==original.length||new Set(next.map(c=>c.id)).size!==original.length||!original.every(c=>next.some(n=>n.id===c.id)))throw Error('カードIDまたは枚数が一致しません');cards=next;save();render();alert('CSVを読み込みました！')}catch(err){alert('読み込めませんでした：'+err.message)}e.target.value=''};
document.querySelector('#reset').onclick=()=>{if(confirm('すべての編集を初期状態に戻しますか？')){cards=JSON.parse(JSON.stringify(original));save();render()}};
render();
</script></body></html>
