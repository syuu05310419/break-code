/* BREAK CODE battle visual update 0.10 */

const DATA=[

const DECK_KEY='break_code_alpha_v09_decks';
function readDecks(){try{const a=JSON.parse(localStorage.getItem(DECK_KEY));if(Array.isArray(a)&&a.length===10)return a.map((d,i)=>({name:String(d.name||`デッキ${i+1}`).slice(0,30),cards:Array.isArray(d.cards)?d.cards.filter(x=>Number.isInteger(x)&&x>=1&&x<=30).slice(0,20):[]}))}catch(e){}return Array.from({length:10},(_,i)=>({name:`デッキ${i+1}`,cards:[]}))}

function bcLocalDiff(before,actor,action){
 if(!G||!before)return;
 const labels={playHand:'カード使用',attack:'攻撃',specialNeko:'特殊召喚',beginTurn:'ターン開始',endTurn:'ターン終了'};
 const out=[];
 G.players.forEach((p,i)=>{const b=before[i],tag=`P${i+1}`;

  if(p.maxEnergy!==b.maxEnergy)out.push(`${tag} 最大エネルギー ${b.maxEnergy} → ${p.maxEnergy}`);
  if(p.energy!==b.energy)out.push(`${tag} 使用可能エネルギー ${b.energy} → ${p.energy}`);
  for(const [key,label] of [['hand','手札'],['deck','山札'],['discard','捨て札']])if(p[key].length!==b[key])out.push(`${tag} ${label} ${b[key]} → ${p[key].length}枚`);
  const old=new Map(b.field.map(u=>[u.uid,u]));const current=new Map(p.field.map(u=>[u.uid,u]));
  for(const u of p.field){const v=old.get(u.uid);if(!v)out.push(`${tag} 盤面に ${card(u.id)?.name||u.id} が登場`);else{if(v.hp!==u.hp)out.push(`${tag} ${card(u.id)?.name||u.id} HP ${v.hp} → ${u.hp}`);if(v.atk!==u.atk)out.push(`${tag} ${card(u.id)?.name||u.id} ATK ${v.atk} → ${u.atk}`)}}

 });
 if(out.length){say(`🔎 P${actor+1} ${labels[action]||action}の処理結果`);for(const line of out.reverse())say('  ↳ '+line)}
}

  if(p.discard.length!==a.discard)out.push(`${tag} 捨て札 ${a.discard} → ${p.discard.length}枚`);
  const prev=new Map(a.field.map(u=>[u.uid,u]));const current=new Set(p.field.map(u=>u.uid));
  for(const u of p.field){const old=prev.get(u.uid);if(!old)out.push(`${tag} 盤面に ${C(u.id)?.name||'ユニット'} 登場`);else{if(u.hp!==old.hp)out.push(`${tag} ${C(u.id)?.name||'ユニット'} HP ${old.hp} → ${u.hp}`);if(u.atk!==old.atk)out.push(`${tag} ${C(u.id)?.name||'ユニット'} ATK ${old.atk} → ${u.atk}`)}}
  for(const u of a.field)if(!current.has(u.uid))out.push(`${tag} ${C(u.id)?.name||'ユニット'} が盤面を離れた`);
 });
 if(out.length){for(const line of out.slice(0,18))logLine('  ↳ '+line);logLine(`🔎 P${actor+1} ${labels[action]||action} の処理結果`)}

<script>

(function(){
const shade=document.getElementById('bc-info-shade'),dialog=document.getElementById('bc-info-dialog');
const all=()=>Array.isArray(window.BREAK_CODE_DATA)?window.BREAK_CODE_DATA:[];

let current=null,hold=null,holdDone=false,suppressUntil=0,libraryScroll=0,libraryQuery='',fromLibrary=false;

 current=c;

 show(`<div class="bc-meta">No.${String(c.id).padStart(3,'0')} ／ ${escInfo(c.rarity==='L'?'レジェンド':c.rarity==='R'?'レア':'ノーマル')}</div>
 <h2>${escInfo(c.name)}</h2>
 <div class="bc-meta">◆ コスト ${escInfo(c.cost)}　${c.type==='U'?`⚔ 攻撃 ${escInfo(c.atk)}　♥ 体力 ${escInfo(c.hp)}`:'✦ スペル'}</div>
 ${tags?`<p class="bc-meta">属性：${escInfo(tags)}</p>`:''}
 ${keys?`<p class="bc-meta">キーワード：${escInfo(keys)}</p>`:''}
 <div class="bc-desc">${escInfo(c.desc||'能力なし')}</div>

}
function library(restore=false){

 inp.value=libraryQuery;inp.addEventListener('input',()=>{libraryQuery=inp.value;render()});list.addEventListener('click',e=>{const b=e.target.closest('[data-info-id]');if(b)detail(cards.find(c=>String(c.id)===b.dataset.infoId))});render();if(restore)dialog.scrollTop=libraryScroll;

 const cands=all();
 if(!cands.length)return null;
 const label=node.querySelector('.nm')?.textContent||node.querySelector('b')?.textContent||node.textContent||'';
 return [...cands].sort((a,b)=>b.name.length-a.name.length).find(c=>label.includes(c.name))||null;

function clearHold(){if(hold){clearTimeout(hold.timer);hold=null}}
document.addEventListener('pointerdown',e=>{

let swipeBlockedUntil=0, swipePointer=null;
function inHand(node){return !!node?.closest('#hand .row,#onlineBattle .ob-hand')}

 if(!hold)return;
 if(hold.pointerId!==e.pointerId)return;
 if(Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>9){
   if(inHand(hold.node)){swipeBlockedUntil=Date.now()+450;swipePointer=e.pointerId}
   clearHold();
 }
},true);

},true);

})();

.bc-mulligan-overlay{position:fixed;inset:0;background:#030814e9;z-index:2500;display:flex;align-items:center;justify-content:center;padding:12px}.bc-mulligan-box{background:linear-gradient(145deg,#243b60,#131c32);border:2px solid #a5a0ff;border-radius:18px;padding:18px;width:min(580px,100%);max-height:90dvh;overflow:auto;color:white}.bc-mulligan-box h2{margin:0 0 8px}.bc-mulligan-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.bc-mulligan-cards button{background:#263857;border:2px solid #5d7298;color:white;text-align:left;border-radius:11px;padding:11px;min-height:94px;overflow-wrap:anywhere}.bc-mulligan-cards button.chosen{border-color:#ffd56e;background:#59472f;box-shadow:0 0 13px #f5bf6266}.bc-mulligan-cards small{display:block;font-size:11px;line-height:1.5;opacity:.85;margin-top:6px}.bc-mulligan-inline{background:#29274e;border:1px solid #9b86ec;border-radius:14px;padding:13px;margin:12px 0}.bc-mulligan-inline h3{margin:0}.bc-mulligan-inline p{font-size:12px}.bc-discard-list{max-height:45dvh;overflow:auto;display:grid;gap:7px}.bc-discard-list button{background:#27395a;color:white;border:1px solid #6079aa;text-align:left;padding:10px;border-radius:9px}.bc-discard-list small{display:block;font-size:11px}.bc-discard-detail{white-space:pre-wrap;background:#101a30;padding:12px;border-radius:10px;margin:12px 0;line-height:1.8}.bc-online-fx{position:absolute;z-index:10;right:22px;top:36%;font-size:32px;font-weight:1000;color:#ff657b;text-shadow:0 0 15px #000;pointer-events:none;animation:bcFloat 1.25s ease-out forwards}.bc-online-fx.heal{color:#78ffc3}.bc-online-fx.summon{color:#ffdd85}.bc-turn-flash{animation:bcFlash .8s ease-out}@keyframes bcFloat{0%{opacity:0;transform:translateY(18px) scale(.5)}25%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-44px) scale(1)}}@keyframes bcFlash{50%{box-shadow:0 0 26px #f8d37b}}
@media(max-width:420px){#onlineBattle .ob-card{flex-basis:118px;min-height:135px}#onlineBattle .bc-stats span,#onlineBattle .bc-stats button{font-size:12px;padding:6px}}
@media(prefers-reduced-motion:reduce){.bc-online-fx,.bc-turn-flash{animation:none}}
</style>
<style>
.bc-019-modal{position:fixed;inset:0;background:#050a1ddd;z-index:2900;display:flex;justify-content:center;align-items:center;padding:15px}
.bc-019-content{width:min(560px,100%);max-height:85dvh;overflow:auto;border:2px solid #91aaff;background:#18223e;color:#f2f4ff;border-radius:18px;padding:18px;box-shadow:0 16px 60px #000b}
.bc-019-content h2{margin:0 0 12px}.bc-019-content button{margin:5px;padding:10px;white-space:normal;text-align:left}
.bc-019-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bc-019-detail{padding:12px;background:#10172d;border-radius:12px;white-space:pre-wrap;line-height:1.6}
.bc-side,.panel{transition:box-shadow .2s,border-color .2s}.ob-card,.card{transition:transform .18s,box-shadow .18s;touch-action:manipulation}
.ob-card.ready,.card.ready{box-shadow:0 0 0 1px #88edc7,0 0 17px #4ff3a04d}.ob-card:active,.card:active{transform:scale(.97)}
.bc-online-log{max-height:230px;overflow:auto;white-space:pre-line;line-height:1.65}
.bc-019-logline{border-bottom:1px solid #ffffff1c;padding:5px 0}.bc-019-logline:first-child{color:#ffe39b;font-weight:700}
.bc-019-legend{animation:bc019Legend 1s ease-out}@keyframes bc019Legend{0%{filter:brightness(2.5);box-shadow:0 0 55px #ffdc64}100%{filter:brightness(1);box-shadow:none}}
@media(max-width:450px){.bc-019-cards{grid-template-columns:1fr}.bc-019-content{padding:12px}}
</style>
<script>
function bcLocalDiscard(who){
 const p=window.G?.players?.[who] || (typeof G!=='undefined'&&G?.players?.[who]);if(!p)return;
 const ids=(p.discard||[]).map(x=>typeof x==='number'?x:x?.id).filter(Boolean);
 const cards=ids.map(id=>{try{return typeof card==='function'?card(id):window.BREAK_CODE_DATA?.find(c=>c.id===id)}catch(e){return null}});
 const modal=document.createElement('div');modal.className='bc-019-modal';
 const pane=document.createElement('section');pane.className='bc-019-content';modal.append(pane);
 const title=document.createElement('h2');title.textContent=`🗑️ P${who+1} の捨て札 (${ids.length}枚)`;pane.append(title);
 const list=document.createElement('div');list.className='bc-019-cards';pane.append(list);
 const detail=document.createElement('div');detail.className='bc-019-detail';detail.textContent='カードを選ぶと能力全文を確認できます';pane.append(detail);
 cards.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=c?`◆${c.cost} ${c.name}`:`No.${ids[i]}`;b.onclick=()=>{detail.textContent=c?`${c.name}　◆${c.cost}　${c.type==='U'?`⚔${c.atk} ♥${c.hp}`:'スペル'}
${(c.keys||[]).join('・')}
${c.desc||'能力なし'}`:'カード情報なし'};list.append(b)});
 if(!ids.length){const p=document.createElement('p');p.textContent='まだ捨て札はありません';list.append(p)}
 const close=document.createElement('button');close.textContent='閉じる';close.onclick=()=>modal.remove();pane.append(close);
 modal.onclick=e=>{if(e.target===modal)modal.remove()};document.body.append(modal);
}
</script>
</html>
