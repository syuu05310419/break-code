const DATA=[
[1,'Luminary創設！　とま','N','U',1,1,2,'男,鯖主','', ''],[2,'Luminary創設！　RIKKUN','N','U',1,2,1,'男,鯖主','',''],[3,'フリルが寝床　水瀬','N','U',1,1,1,'男,寝落ち','',''],[4,'ディーラー　るみ姉','N','U',2,2,1,'女,bot','',''],[5,'みんなの妹　えみ','N','U',1,1,1,'女,bot','',''],[6,'会議の番人　nekopen','N','U',2,2,1,'男','','召喚時：手札1枚を捨てて1枚引く'],[7,'Luminaryのオタク　うさ','N','U',2,2,1,'女','','召喚時：相手の手札1枚をランダムに捨てる'],[8,'裏サメbot','N','U',2,0,2,'サメ,bot','速攻','召喚時：自分の場のサメの数だけ攻撃力増加'],[9,'おーまいがっちょん！　mado','N','U',3,2,3,'女','','召喚時：自分のリーダーHPを2回復'],[10,'優しい瞳　くろぱん','N','U',3,3,3,'男,ゲーマー','ガード',''],[11,'Luminaryスロット','N','S',2,0,0,'ゲーム,bot','','1枚引く。追加1コストでさらに1枚'],[12,'面接','N','S',2,0,0,'鯖主','','デッキから鯖主ユニットをランダムに手札へ'],[13,'プロフ審査','N','S',1,0,0,'bot','','デッキ上を公開、ユニットなら手札へ'],[14,'きゅんタグ','N','S',1,0,0,'サーバータグ','','相手ユニットかリーダーに2ダメージ'],[15,'うさぎさんレース','N','S',4,0,0,'ゲーム,bot','','味方1体に速攻を付与'],[16,'みあちゃんねる！　みあ','R','U',2,2,2,'女,アイドル','','召喚時（任意）：手札1枚を捨ててもよい。捨てた場合、最大コスト+1'],[17,'ゲームマスター　纏','R','U',4,2,4,'男,bot','再生','botスペル使用時：相手リーダーに1ダメージ'],[18,'サメbot','R','U',2,2,2,'サメ,bot','','召喚時：1枚引く'],[19,'るみのパティシエール　や～','R','U',5,3,4,'男,ゲーマー','','召喚時：味方1体を+2/+2、自リーダー2回復'],[20,'創作仕事人　冬李','R','U',3,3,2,'女,クリエイター','','召喚時：敵リーダー3、自リーダー1ダメージ'],[21,'通りすがりの凶器　kqrqsu','R','U',4,4,2,'男,悪魔','貫通,速攻','女への攻撃時：攻撃力+2'],[22,'Luminaryの聖母　みどり','R','U',5,4,6,'女,ママ','ガード,再生','召喚時：他の味方全員+1/+1、女はさらに+1/+1'],[23,'童貞喰い　ねこ','R','U',7,4,3,'女','速攻,再生','味方4体破壊で手札・捨て札から0召喚可。召喚時：手札のコスト5以下の女を0召喚、敵リーダー3ダメージ'],[24,'サメbot創設者　ひも','R','U',7,3,7,'男,サメ,クリエイター','ガード','場にいる間サメは貫通。召喚時：捨て札からサメを最大3体ランダム召喚'],[25,'男・尊・女・卑！！！！','R','S',6,0,0,'男,必殺技','','自分の場に男2体以上・女0体：敵ユニット全破壊、敵リーダー6ダメージ'],[26,'女・尊・男・卑！！！！','R','S',6,0,0,'女','','自分の場に女2体以上・男0体：敵手札全捨て、敵リーダー7ダメージ'],[27,'Luminary総会','R','S',5,0,0,'鯖主','','敵ユニット1体破壊、敵リーダー2ダメージ、2枚引く'],[28,'Luminaryの創造主　りくとま','L','U',8,8,6,'男,鯖主,神','貫通,再生','召喚時：1枚引きコスト0化、敵リーダー6ダメージ'],[29,'人類もきゅ化計画　ちゆ&もきゅ獣たち','L','U',8,5,8,'女,酒カス,もきゅ','','相手ターン中のみ相手の全ダメージ-1、2回攻撃。召喚時：敵全体4ダメージ'],[30,'耀光龍 ルミナリア','L','U',8,6,6,'ドラゴン','貫通','破壊時：次のターン開始時、捨て札から0コスト召喚し速攻を得る']

// Collection is saved separately from decks so older deck data survives upgrades.
const COLLECTION_KEY='break_code_alpha_v012_collection';
function initialCollection(){const owned={};for(let i=1;i<=10;i++)owned[i]=2;return {coins:300,owned,packs:0,wins:0,losses:0}}
function loadCollection(){try{const x=JSON.parse(localStorage.getItem(COLLECTION_KEY));if(x&&Number.isFinite(x.coins)&&x.owned&&typeof x.owned==='object'){const owned={};for(const c of DATA)owned[c.id]=Math.max(0,Math.floor(Number(x.owned[c.id])||0));return {coins:Math.max(0,Math.floor(x.coins)),owned,packs:Math.max(0,Math.floor(x.packs||0)),wins:Math.max(0,Math.floor(x.wins||0)),losses:Math.max(0,Math.floor(x.losses||0))}}}catch(e){}return initialCollection()}
let collection=loadCollection(),lastPull=[];

let G=null,uid=1,selected=null;const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n),shuffle=a=>a.sort(()=>Math.random()-.5),card=id=>DATA.find(x=>x.id===id),tag=(u,t)=>card(u.id).tags.includes(t),has=(u,k)=>u.keys.includes(k)||(k==='貫通'&&tag(u,'サメ')&&G.players[u.owner].field.some(x=>x.id===24));const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function make(id,owner){let c=card(id);return {uid:uid++,id,owner,atk:c.atk,hp:c.hp,max:c.hp,keys:[...c.keys],attacks:0,ready:false,cost:c.cost};}
function deck(useOwned=false){if(useOwned){let ids=[];for(const c of DATA){let n=Math.min(2,ownedCount(c.id));if(c.rarity==='L')n=Math.min(1,n);for(let k=0;k<n;k++)ids.push(c.id)}shuffle(ids);let chosen=[],lg=0;for(const id of ids){if(chosen.length===20)break;if(DATA[id-1].rarity==='L'){if(lg)continue;lg++}chosen.push(id)}return shuffle(chosen)}let pool=shuffle([...DATA.filter(x=>x.rarity!=='L'),...DATA.filter(x=>x.rarity!=='L'),...DATA.filter(x=>x.rarity==='L')]);let chosen=[],counts={},legendCount=0;for(let c of pool){if(chosen.length===20)break;if(c.rarity==='L'&&legendCount>=1)continue;if((counts[c.id]||0)>=(c.rarity==='L'?1:2))continue;chosen.push(c.id);counts[c.id]=(counts[c.id]||0)+1;if(c.rarity==='L')legendCount++;}return shuffle(chosen)}
function say(s){G.log.unshift(s);G.log=G.log.slice(0,300)}
function player(i){return G.players[i]}function foe(i){return player(1-i)}
function draw(i){let p=player(i);if(!p.deck.length){p.fatigue++;hitLeader(i,p.fatigue,undefined,`山札切れ・疲労${p.fatigue}`);return null;}let c=make(p.deck.pop(),i);if(p.hand.length>=10){p.discard.push(c);say('手札上限のためカードを捨てた');return null;}p.hand.push(c);return c}
function hitLeader(i,d,from,source='効果'){let reduction=from!==undefined&&from!==i&&G.active===from?foe(from).field.filter(x=>x.id===29).length:0;let dmg=Math.max(0,d-reduction),before=player(i).hp;player(i).hp-=dmg;let detail=reduction?`（${d} - 軽減${Math.min(d,reduction)} = ${dmg}）`:`（${d}）`;say(`♥ P${i+1} リーダー：${source} → ${dmg}ダメージ${detail}｜HP ${before} → ${player(i).hp}`);battleDamageFx(dmg,i);return dmg}

function selectChoice(title,items,{cancel=true}={}){return new Promise(resolve=>{let overlay=$('choiceOverlay'),list=$('choiceItems'),ok=$('choiceOk'),back=$('choiceCancel');$('choiceTitle').textContent=title;list.innerHTML='';overlay.classList.remove('hidden');let selectedIndex=-1;ok.disabled=true;back.style.display=cancel?'':'none';function finish(v){overlay.classList.add('hidden');ok.onclick=null;back.onclick=null;resolve(v)};items.forEach((item,k)=>{let button=document.createElement('button');button.className='card';button.type='button';if(item.u){let c=card(item.u.id);button.innerHTML=`<div class="mini">No.${String(c.id).padStart(3,'0')}　◆${item.u.cost}</div><div class="nm">${esc(c.name)}</div><div class="mini">${esc(c.tags.join('・'))}</div><div class="txt">${esc([...item.u.keys,c.desc].filter(Boolean).join(' / '))}</div><div class="stats">${c.type==='U'?`⚔${item.u.atk}　♥${item.u.hp}/${item.u.max}`:'✦ スペル'}</div>`}else{button.innerHTML=`<div class="nm">${esc(item.label)}</div>`}button.onclick=()=>{selectedIndex=k;for(let child of list.children)child.classList.remove('sel');button.classList.add('sel');ok.disabled=false};list.appendChild(button)});ok.onclick=()=>{if(selectedIndex>=0)finish(items[selectedIndex].value)};back.onclick=()=>finish(null)})}
async function chooseFriendly(i,msg){let p=player(i);if(!p.field.length)return null;if(G.mode==='cpu'&&i===1)return p.field[0];return await selectChoice(msg,p.field.map(x=>({u:x,value:x})))}

async function summon(u,i,trigger=true){let p=player(i);if(p.field.length>=4)return false;u.owner=i;u.atk=card(u.id).atk;u.hp=card(u.id).hp;u.max=u.hp;u.keys=[...card(u.id).keys];u.attacks=0;u.ready=u.keys.includes('速攻');p.field.push(u);say(`P${i+1} 召喚：${card(u.id).name}`);bcSummonFx(card(u.id));if(trigger)await onSummon(u,i);cleanup();return true}
async function onSummon(u,i){let p=player(i),e=foe(i),c=card(u.id);if(u.id===6){if(p.hand.length){let a=await chooseHand(i,p.hand,'捨てる手札を選択');if(a){p.hand.splice(p.hand.indexOf(a),1);p.discard.push(a)}}draw(i)}if(u.id===7)randomDiscard(1-i);if(u.id===8)u.atk+=p.field.filter(x=>tag(x,'サメ')).length;if(u.id===9)heal(i,2);if(u.id===16&&p.hand.length&&p.maxEnergy<8){let a=await chooseHand(i,p.hand,'みあ：捨てるカードを選択（キャンセルで効果を使わない）');if(a){p.hand.splice(p.hand.indexOf(a),1);p.discard.push(a);p.maxEnergy=Math.min(8,p.maxEnergy+1);say('みあ：手札を捨てて最大コスト+1')}else say('みあ：能力を使用しない')}if(u.id===18)draw(i);if(u.id===19){let target=await chooseFriendly(i,'+2/+2する味方を選択');if(target){target.atk+=2;target.max+=2;target.hp+=2;}heal(i,2)}if(u.id===20){hitLeader(1-i,3,i,c.name+'（召喚時）');hitLeader(i,1,i,c.name+'（自傷）')}if(u.id===22){for(let a of p.field.filter(x=>x.uid!==u.uid)){let n=tag(a,'女')?2:1;a.atk+=n;a.max+=n;a.hp+=n}}if(u.id===23){let options=p.hand.filter(x=>card(x.id).type==='U'&&tag(x,'女')&&card(x.id).cost<=5);if(options.length&&p.field.length<4){let a=await chooseHand(i,options,'0コスト召喚する女ユニットを選択');if(a){p.hand.splice(p.hand.indexOf(a),1);await summon(a,i,true)}}hitLeader(1-i,3,i,c.name+'（召喚時）')}if(u.id===24){let pool=shuffle(p.discard.filter(x=>tag(x,'サメ')));for(let a of pool.slice(0,Math.min(3,4-p.field.length))){if(p.field.length>=4)break;p.discard.splice(p.discard.indexOf(a),1);await summon(a,i,true)}}if(u.id===28){let a=draw(i);if(a)a.cost=0;hitLeader(1-i,6,i,c.name+'「冗談ですやんw」')}if(u.id===29){for(let a of [...e.field])hitUnit(a,4,i,c.name+'「すたーともきゅ〜！」')}}
function validSpell(c,i){let p=player(i),e=foe(i);if(c.id===25)return p.field.filter(x=>tag(x,'男')).length>=2&&!p.field.some(x=>tag(x,'女'));if(c.id===26)return p.field.filter(x=>tag(x,'女')).length>=2&&!p.field.some(x=>tag(x,'男'));if(c.id===27)return e.field.length>0;if(c.id===15)return p.field.length>0;return true}

}if(c.id===12){let opts=p.deck.filter(id=>card(id).type==='U'&&card(id).tags.includes('鯖主'));if(opts.length){let id=opts[rand(opts.length)];p.deck.splice(p.deck.indexOf(id),1);let u=make(id,i);if(p.hand.length<10)p.hand.push(u);else p.discard.push(u)}}if(c.id===13){if(p.deck.length){let u=make(p.deck.pop(),i);if(card(u.id).type==='U'&&p.hand.length<10)p.hand.push(u);else p.discard.push(u)}else draw(i)}if(c.id===14){if(chosenTarget==='leader')hitLeader(1-i,2,i,card(c.id).name);else if(chosenTarget)hitUnit(chosenTarget,2,i,card(c.id).name)}if(c.id===15){let t=chosenTarget;if(t){if(!t.keys.includes('速攻'))t.keys.push('速攻');t.ready=true}}if(c.id===25){for(let u of [...e.field])kill(u);hitLeader(1-i,6,i,card(c.id).name)}if(c.id===26){while(e.hand.length)e.discard.push(e.hand.pop());hitLeader(1-i,7,i,card(c.id).name)}if(c.id===27){if(chosenTarget)kill(chosenTarget);hitLeader(1-i,2,i,card(c.id).name);draw(i);draw(i)}if(card(c.id).tags.includes('bot'))for(let a of p.field.filter(x=>x.id===17))hitLeader(1-i,1,i,'ゲームマスター　纏（botスペル連動）');cleanup()}
let busy=false;
async function playHand(idx,i=G.active){if(busy||G.over||G.active!==i)return;let p=player(i),c=p.hand[idx];if(!c)return;let base=card(c.id);if(c.cost>p.energy){say('コスト不足');render();return}if(base.type==='U'&&p.field.length>=4){if(c.id===23){await specialNeko('hand');return;}say('場が満員');render();return}if(base.type==='S'&&!validSpell(c,i)){say('発動条件を満たしていない');render();return}busy=true;try{let target=null;if(base.type==='S'&&[14,15,27].includes(c.id)){target=c.id===15?await chooseFriendly(i,'速攻を付与する味方を選択'):await pickTarget(i,c.id===14);if(target===null)return}p.energy-=c.cost;p.hand.splice(idx,1);battleToast(base.type==='U'?'⚡ ユニット召喚！':'✦ スペル発動！');if(base.type==='S')bcParticles('#bca5ff',15);if(base.type==='U')await summon(c,i,true);else{await spell(c,i,target);p.discard.push(c)}cleanup();render()}finally{busy=false}if(G.mode==='cpu'&&G.active===1&&!G.over)setTimeout(cpuTurn,100)}
async function specialNeko(from){
 if(busy||!G||G.over)return;
 const i=G.active,p=player(i);
 if(p.field.length!==4){say('ねこ特殊召喚には自分の場に4体必要');render();return;}
 const options=[...p.hand.map(u=>({u,from:'hand'})),...p.discard.map(u=>({u,from:'discard'}))].filter(x=>x.u.id===23);
 if(!options.length){say('手札・捨て札にねこがいない');render();return;}
 let chosen;
 if(options.length===1)chosen=options[0];
 else{
  chosen=await selectChoice('特殊召喚する「ねこ」を選択',options.map((x,k)=>({u:x.u,value:k}))).then(k=>k===null?null:options[k]);
  if(!chosen)return;
 }
 const answer=await selectChoice('味方4体を破壊し、ねこを0コスト召喚する？',[{label:'特殊召喚する（味方4体を破壊）',value:true},{label:'やめる',value:false}],{cancel:false});
 if(!answer)return;
 busy=true;
 try{
  // 対象のねこは破壊処理が終わるまで手札・捨て札に残す。
  for(const ally of [...p.field])kill(ally);
  const source=chosen.from==='hand'?p.hand:p.discard;
  const at=source.findIndex(u=>u.uid===chosen.u.uid);
  if(at<0){say('ねこが指定の領域から移動したため不発');render();return;}
  const neko=source.splice(at,1)[0];
  const ok=await summon(neko,i,true);
  if(!ok)source.push(neko);
  cleanup();render();
 }finally{busy=false;render()}
}
async function attack(index){if(busy||G.over)return;let i=G.active,p=player(i),e=foe(i),u=p.field[index];if(!u||!u.ready||u.attacks>=(u.id===29?2:1))return;busy=true;try{let guards=e.field.filter(x=>has(x,'ガード'));let target=null;if(guards.length){target=G.mode==='cpu'&&i===1?guards[0]:await selectChoice('ガードユニットを選択',guards.map(x=>({u:x,value:x})))}else if(e.field.length){target=await pickTarget(i,false)}else target='leader';if(target===null)return;u.attacks++;battleToast('⚔ アタック！');bcAttackFx();if(u.id===21&&target!=='leader'&&tag(target,'女'))u.atk+=2;if(target==='leader'){hitLeader(1-i,u.atk,i,card(u.id).name+'（直接攻撃）')}else{let before=target.hp,atk=hitUnit(target,u.atk,i,card(u.id).name+'（攻撃）'),counter=hitUnit(u,target.atk,1-i,card(target.id).name+'（反撃）');if(has(u,'貫通')&&atk>Math.max(0,before))hitLeader(1-i,atk-Math.max(0,before),i,card(u.id).name+'（貫通）');say(`${card(u.id).name} ↔ ${card(target.id).name}（戦闘終了）`)}cleanup();render()}finally{busy=false}}
function start(mode){bcResultShown=false;$('battleFx').replaceChildren();$('battleDecks').classList.add('hidden');uid=1;let own=battleDeck!=='auto'&&deckReady(decks[Number(battleDeck)]?.cards||[])?shuffle([...decks[Number(battleDeck)].cards]):null;G={mode,players:[0,1].map(i=>({hp:20,maxEnergy:0,energy:0,deck:i===0?(own?[...own]:deck(true)):deck(),hand:[],field:[],discard:[],fatigue:0})),active:rand(2),turnCount:0,log:[],revive:[],over:false};for(let i=0;i<2;i++)for(let j=0;j<4;j++)draw(i);$('setup').classList.add('hidden');$('game').classList.remove('hidden');say('対戦開始！ 初期手札4枚。');mulligan(0);mulligan(1);beginTurn()}
function mulligan(i){if(G.mode==='cpu'&&i===1)return;let p=player(i);let text=p.hand.map((x,k)=>`${k+1}: ${card(x.id).name}`).join('\n');let answer=prompt(`P${i+1} マリガン（任意）：交換したいカード番号をカンマ区切りで入力。空欄なら交換なし\n${text}`,'');if(!answer)return;let indices=[...new Set(answer.split(/[,、\s]+/).map(x=>Number(x)-1).filter(x=>x>=0&&x<p.hand.length))].sort((a,b)=>b-a);let removed=indices.map(idx=>p.hand.splice(idx,1)[0].id);p.deck.push(...removed);shuffle(p.deck);for(let id of removed)draw(i);say(`P${i+1} ${removed.length}枚交換`)}
async function beginTurn(){if(G.over)return;G.turnCount++;let i=G.active,p=player(i);p.maxEnergy=Math.min(8,p.maxEnergy+1);p.energy=p.maxEnergy;for(let u of p.field){u.attacks=0;u.ready=true;if(has(u,'再生'))u.hp=Math.min(u.max,u.hp+1)}let pending=G.revive.filter(x=>x.at===G.turnCount);G.revive=G.revive.filter(x=>x.at!==G.turnCount);for(let r of pending){let own=player(r.owner),idx=own.discard.findIndex(x=>x.uid===r.uid);if(idx>=0&&own.field.length<4){let u=own.discard.splice(idx,1)[0];await summon(u,r.owner,true);if(own.field.some(x=>x.uid===u.uid)){if(!u.keys.includes('速攻'))u.keys.push('速攻');u.ready=true}say('ルミナリア：不滅の輝き発動')}else say('ルミナリア：復活不発')}draw(i);if(p.hp<=5)draw(i);if(G.turnCount===2)draw(i);say(`── P${i+1} のターン ──`);cleanup();render();if(G.mode==='cpu'&&i===1&&!G.over)setTimeout(cpuTurn,500)}
function endTurn(){if(busy||G.over)return;G.active=1-G.active;beginTurn()}
function cpuTurn(){if(busy||!G||G.over||G.mode!=='cpu'||G.active!==1)return;let p=player(1),available=p.hand.findIndex(x=>x.cost<=p.energy&&(card(x.id).type==='U'?p.field.length<4:validSpell(x,1)));if(available>=0){playHand(available,1);return}let attacker=p.field.findIndex(x=>x.ready&&x.attacks<(x.id===29?2:1));if(attacker>=0){attack(attacker).then(()=>setTimeout(cpuTurn,160));return}endTurn()}
let bcEffectsOn=true;
try{bcEffectsOn=localStorage.getItem('bc_fx_off')!=='1'}catch(e){}
let bcResultShown=false;
function bcFxAllowed(){return bcEffectsOn&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches}
function bcToggleEffects(v){bcEffectsOn=!!v;try{localStorage.setItem('bc_fx_off',bcEffectsOn?'0':'1')}catch(e){}}
function bcAddFx(className,ttl,text){if(!bcFxAllowed()||!G)return null;const root=$('battleFx');if(!root)return null;const el=document.createElement('div');el.className=className;if(text!==undefined)el.textContent=text;root.appendChild(el);setTimeout(()=>el.remove(),ttl);return el}
function bcParticles(color,count=13){if(!bcFxAllowed())return;for(let k=0;k<count;k++){let el=bcAddFx('bc-particle',900);if(!el)break;let a=(k/count)*Math.PI*2;let dist=70+(k%4)*28;el.style.setProperty('--dx',Math.round(Math.cos(a)*dist)+'px');el.style.setProperty('--dy',Math.round(Math.sin(a)*dist)+'px');el.style.setProperty('--particle',color)}}
function bcSummonFx(c){if(!bcFxAllowed())return;if(c.rarity==='L'){bcAddFx('bc-legend',2100);bcAddFx('bc-legend-title',2100,'✦ LEGEND ✦\n'+c.name);bcParticles('#ffd16a',24)}else{bcAddFx('bc-summon',850);bcParticles(c.rarity==='R'?'#d0a4ff':'#7be7ff',12)}}
function bcAttackFx(){if(!bcFxAllowed())return;bcAddFx('bc-strike',500);const el=$('game');el.classList.remove('bc-shake');void el.offsetWidth;el.classList.add('bc-shake');setTimeout(()=>el.classList.remove('bc-shake'),390)}
function bcResultFx(){if(!G||!G.over||bcResultShown)return;bcResultShown=true;let msg=G.players[0].hp<=0&&G.players[1].hp<=0?'DRAW':G.players[0].hp<=0?'P2 WIN':'P1 WIN';if(!bcEffectsOn)return;const root=$('battleFx');const layer=document.createElement('div');layer.className='bc-result';const title=document.createElement('h2');title.textContent=msg;const sub=document.createElement('p');sub.textContent=msg==='DRAW'?'引き分け！':'対戦終了！';const btn=document.createElement('button');btn.textContent='対戦メニューに戻る';btn.onclick=()=>newGame();layer.append(title,sub,btn);root.appendChild(layer);}
function battleDamageFx(damage,owner){
 if(!G||!damage||!document.getElementById('game')||document.getElementById('game').classList.contains('hidden'))return;
 const root=document.getElementById('battleFx');if(!root)return;
 if(!bcFxAllowed())return;const flash=document.createElement('div');flash.className='fx-flash';root.appendChild(flash);
 const el=document.createElement('div');el.className='fx-damage '+(owner===G.active?'mine':'enemy');el.textContent='−'+damage;root.appendChild(el);

}
function battleToast(message){

function newGame(){if(busy)return;if(G&&!confirm('現在の対戦を終了して新しく始める？'))return;G=null;bcResultShown=false;$('battleFx').replaceChildren();$('setup').classList.remove('hidden');$('game').classList.add('hidden');$('editor').classList.add('hidden');$('collection').classList.add('hidden');$('battleDecks').classList.remove('hidden');$('wallet').classList.remove('hidden');updateWallet();renderDeckSelect()}
function cardHtml(u,action='',i=0){let c=card(u.id);return `<button class="card ${c.rarity==='L'?'legend':c.rarity==='R'?'rare':''} ${u.ready&&action==='attack'?'ready':''}" onclick="${action==='play'?`playHand(${i})`:action==='attack'?`attack(${i})`:'void(0)'}"><div><span class="cost">◆${u.cost}</span><span class="mini">No.${String(c.id).padStart(3,'0')} ${c.rarity}</span></div><div class="nm">${esc(c.name)}</div><div class="mini">${esc(c.tags.join('・'))}</div><div class="txt">${esc([...u.keys,c.desc].filter(Boolean).join(' / '))}</div><div class="stats">${c.type==='U'?`⚔${u.atk}　♥${u.hp}/${u.max}`:'✦ スペル'}${action==='attack'?`　${u.attacks}/${u.id===29?2:1}`:''}</div></button>`}
function render(){if(!G)return;let i=G.active,p=player(i),e=foe(i);$('turn').innerHTML=`<div class="top"><strong class="bc-turn-indicator">${G.over?'対戦終了':`⚡ P${i+1} TURN`}</strong><span class="chip">ターン ${G.turnCount}</span><span class="chip">${G.mode==='cpu'?'CPU対戦':'ローカル2人対戦'}</span></div>${G.over?`<div class="notice">${G.log[0]}</div>`:''}`;$('enemy').innerHTML=`<h3>相手 P${2-i}　♥ ${e.hp}/20　手札 ${e.hand.length}　山札 ${e.deck.length}　捨て札 ${e.discard.length}</h3><div class="bc-hp-track"><span style="width:${Math.max(0,Math.min(100,e.hp*5))}%"></span></div><div class="row">${e.field.map(x=>cardHtml(x)).join('')||'<span class="mini">ユニットなし</span>'}</div>`;$('mine').innerHTML=`<h3>自分 P${i+1}　♥ ${p.hp}/20　エネルギー ${p.energy}/${p.maxEnergy}　山札 ${p.deck.length}　捨て札 ${p.discard.length}</h3><div class="bc-hp-track"><span style="width:${Math.max(0,Math.min(100,p.hp*5))}%"></span></div><div class="row">${p.field.map((x,k)=>cardHtml(x,'attack',k)).join('')||'<span class="mini">ユニットなし</span>'}</div>`;$('hand').innerHTML=`<h3>手札 ${p.hand.length}/10 <span class="mini">タップして使用</span></h3><div class="row">${p.hand.map((x,k)=>cardHtml(x,'play',k)).join('')||'<span class="mini">手札なし</span>'}</div>`;let n=p.field.length===4&&(p.hand.some(x=>x.id===23)||p.discard.some(x=>x.id===23));$('controls').innerHTML=`<div class="actions"><button class="primary" onclick="endTurn()" ${G.over?'disabled':''}>ターン終了</button>${n?`<button class="primary" onclick="specialNeko()">🐈 ねこ特殊召喚（4体を生贄）</button>`:''}<label class="bc-fx-toggle"><input type="checkbox" ${bcEffectsOn?'checked':''} onchange="bcToggleEffects(this.checked)">演出ON</label><button onclick="alert('${'盤面4体で手札のねこをタップ、または「ねこ特殊召喚」ボタン / 手札カード→使用 / 自分の場→攻撃 / ターン終了で交代。対象カードをタップ・クリックで選択し、決定。貫通・速攻でも敵ユニットを無視できません。'.replaceAll("'",'')}')">遊び方</button></div><div class="mini">${G.mode==='local'?'同じ画面を交互に使用。手札を相手に見せないように交代してください。':'CPUは簡易AIです。'}　※テスト版：オンライン通信は未実装。コイン報酬はCPU対戦のみ。</div>`;$('log').textContent=G.log.join('\n')}
try{saveCollection();updateWallet();renderDeckSelect()}catch(e){document.getElementById('battleDecks').textContent='初期化エラー: '+e.message;console.error(e)}</script></body></html>
